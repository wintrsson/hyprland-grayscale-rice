backend = "glx";
vsync = true;
corner-radius = 12;
rounded-corners-exclude = [ "window_type = 'dock'", "class_g = 'bootsplash'" ];
shadow = true;
shadow-radius = 22;
shadow-opacity = 0.55;
shadow-offset-x = -14;
shadow-offset-y = -12;
shadow-exclude = [ "window_type = 'dock'", "class_g = 'bootsplash'", "_GTK_FRAME_EXTENTS@" ];
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
inactive-opacity = 1.0;
active-opacity = 1.0;
blur-method = "dual_kawase";
blur-strength = 7;
blur-background-exclude = [ "class_g = 'bootsplash'", "window_type = 'desktop'", "_GTK_FRAME_EXTENTS@" ];
opacity-rule = [ "100:class_g = 'mpv'", "100:class_g = 'Jellyfin Media Player'", "100:fullscreen" ];
# the dashboard panes and the bar cut on and off instantly (no fade) so the boot flicker is sharp
fade-exclude = [ "class_g ~= '^dash-'", "class_g = 'Polybar'", "class_g = 'bootsplash'" ];
