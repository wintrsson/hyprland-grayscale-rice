# same idea as the i3 setup: lock after 10 min idle, never blank the screen
general {
    lock_cmd = pidof hyprlock || hyprlock
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'   # wake the screen after resume
    before_sleep_cmd = loginctl lock-session; sleep 1.5   # let the lock screen finish drawing before the machine sleeps
}
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}
