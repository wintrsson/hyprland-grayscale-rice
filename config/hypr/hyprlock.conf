# monochrome lock screen (blurred grayscale wallpaper from the i3 lock script, dark ring, clock + date)
general {
    hide_cursor = true
    ignore_empty_input = true
}
background {
    monitor =
    path = /home/noahd/.cache/lock-blur.png
}
label {
    monitor =
    text = cmd[update:1000] date +"%I:%M"
    color = rgba(236, 236, 236, 0.88)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 180
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = rgba(154, 154, 154, 1.0)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 110
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 180, 180
    rounding = -1
    outline_thickness = 6
    dots_size = 0.2
    dots_spacing = 0.3
    outer_color = rgb(3a3a3a)
    inner_color = rgba(10, 10, 10, 0.8)
    font_color = rgb(216, 216, 216)
    check_color = rgb(216, 216, 216)
    fail_color = rgb(140, 140, 140)
    capslock_color = rgb(140, 140, 140)
    fade_on_empty = false
    placeholder_text =
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}
